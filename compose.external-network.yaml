# overlay for host already running cloudflared in docker, joins its network as http://ris-mcp:8000, no published port
# network name via
#   docker inspect <cloudflared-container> --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
# then CF_NETWORK in .env + public hostname on tunnel
#   docker compose -f compose.yaml -f compose.external-network.yaml up -d --build

services:
  ris-mcp:
    networks:
      - default
      - tunnel

networks:
  tunnel:
    external: true
    name: ${CF_NETWORK:?set CF_NETWORK to the docker network your cloudflared runs on}
