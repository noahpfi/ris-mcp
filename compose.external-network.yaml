# Overlay for a host that already runs cloudflared in Docker.
#
# Joins ris-mcp to the network that connector is on, so it can be reached as
# http://ris-mcp:8000 without publishing a port. Find the network with:
#   docker inspect <cloudflared-container> \
#     --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
# then set CF_NETWORK in .env and add the public hostname to your tunnel.
#
#   docker compose -f compose.yaml -f compose.external-network.yaml up -d --build

services:
  ris-mcp:
    networks:
      - default
      - tunnel

networks:
  tunnel:
    external: true
    name: ${CF_NETWORK:?set CF_NETWORK to the docker network your cloudflared runs on}
