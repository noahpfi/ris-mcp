# overlay for host without cloudflared, runs connector alongside
#   docker compose -f compose.yaml -f compose.tunnel.yaml up -d --build
# route one public hostname to http://ris-mcp:8000, no path rules, container serves /mcp + landing page

services:
  cloudflared:
    # floating tag on purpose, Cloudflare expires old tunnel clients
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ris-mcp:
        condition: service_healthy
