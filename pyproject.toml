[project]
name = "ris-mcp"
version = "0.1.0"
description = "MCP server for Austria's RIS (Rechtsinformationssystem)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "selectolax>=0.3.21,<1.0.0",
]

[project.scripts]
ris-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real RIS API; run with -m live"]
addopts = "-m 'not live'"
